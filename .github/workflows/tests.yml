name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      # Tests live in backend/ today; cli/ has no tests yet.
      - name: Pytest (backend)
        # --no-sync prevents uv run's implicit re-sync from dropping member
        # extras (it defaults to no extras and would remove pytest).
        run: cd backend && uv run --no-sync pytest
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only
