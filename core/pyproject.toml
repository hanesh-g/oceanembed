[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanembed-core"
version = "0.1.0"
description = "Shared preprocessing package for OceanEmbed — used by both the inference worker and offline training code."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "xarray>=2024.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["oceanembed_core*"]
